services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: portable-kiosk-mssql
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-YourStrongPassword123!}"
    ports:
      - "${MSSQL_PORT:-1434}:1433"
    volumes:
      - portable_kiosk_mssql_data:/var/opt/mssql

volumes:
  portable_kiosk_mssql_data:
    driver: local